name: Deploy professional portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public website bundles
        uses: actions/checkout@v6
      - name: Assemble verified static website
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          output = Path('_site')
          output.mkdir()
          bundles = sorted(Path('.').glob('site-bundle-*.zip'))
          assert bundles, 'Website bundles are missing'
          for bundle in bundles:
              with ZipFile(bundle) as archive:
                  archive.extractall(output)
          assert (output / 'index.html').exists()
          assert (output / 'zh' / 'index.html').exists()
          assert (output / 'assets' / 'city-of-stars.mp4').exists()
          PYTHON
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
